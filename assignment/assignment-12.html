<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment-12</title>

    <style>
        .box {
            border: 2px solid rgb(0, 217, 72);
        }

        #margin {
            margin-left: 40px;
            margin-right: 40px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 300px;

        }

        table,
        th,
        td {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box">
        <div id="margin">
            <table border="2px solid black" cellpadding="5">
                <caption>Student Marks</caption>
                <tr>
                    <th>Roll</th>
                    <th>Name</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Aman</td>
                    <td>85</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Riya</td>
                    <td>92</td>
                </tr>
                <tr>
                    <td colspan="2">Average</td>
                    <td>88.5</td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
