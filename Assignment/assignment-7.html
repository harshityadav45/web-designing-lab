<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>assignment-7</title>
    <style>
        .box {
            border: 2px solid rgb(0, 217, 72);

        }

        .margin {
            margin-left: 5%;
            margin-right: 5%;
        }

        * {
            margin: 0px;
            padding: 0px;
        }

        .navbar {
            width: 100%;
            height: 50px;
            background-color: black;
            margin: 10px auto;
        }

        .navbar ul {
            list-style-type: none;
        }

        .navbar ul li {
            width: 25%;
            float: left;
            text-align: center;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            line-height: 50px;
            display: block;
        }

        .navbar ul li a:hover {
            background-color: aqua;
            color: black;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="margin">
            <nav class="navbar">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Courses</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </div>
</body>

</html>
